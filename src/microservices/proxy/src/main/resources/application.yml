server:
  port: ${PORT:8000}

spring:
  application:
    name: proxy-service
  cloud:
    gateway:
      routes:
        - id: monolith_route
          uri: ${MONOLITH_URL:http://localhost:8080}
          predicates:
            - Path=/api/users/**, /api/profile/**, /api/payments/**

        - id: movies_service_route
          uri: ${MOVIES_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/movies/**

        - id: events_service_route
          uri: ${EVENTS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/events/**

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"